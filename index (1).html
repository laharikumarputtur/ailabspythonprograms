const PROGRAMS = [{"title": "Breadth First Search (BFS)", "aim": "To implement Breadth First Search and traverse a graph level by level using a queue.", "filename": "program_01_bfs.py", "code": "from collections import deque\n\ngraph = {\"A\": [\"B\", \"C\"], \"B\": [\"D\", \"E\"],\n         \"C\": [\"F\"], \"D\": [], \"E\": [], \"F\": []}\n\nqueue = deque([\"A\"])\nvisited = {\"A\"}\norder = []\n\nwhile queue:\n    node = queue.popleft()\n    order.append(node)\n    for neighbour in graph[node]:\n        if neighbour not in visited:\n            visited.add(neighbour)\n            queue.append(neighbour)\n\nprint(\"BFS Traversal:\", \" -> \".join(order))\n", "output": "BFS Traversal: A -> B -> C -> D -> E -> F"}, {"title": "Depth First Search (DFS)", "aim": "To implement Depth First Search and traverse a graph by exploring each branch before backtracking.", "filename": "program_02_dfs.py", "code": "graph = {\"A\": [\"B\", \"C\"], \"B\": [\"D\", \"E\"],\n         \"C\": [\"F\"], \"D\": [], \"E\": [], \"F\": []}\nvisited = set()\norder = []\n\ndef dfs(node):\n    visited.add(node)\n    order.append(node)\n    for neighbour in graph[node]:\n        if neighbour not in visited:\n            dfs(neighbour)\n\ndfs(\"A\")\nprint(\"DFS Traversal:\", \" -> \".join(order))\n", "output": "DFS Traversal: A -> B -> D -> E -> C -> F"}, {"title": "Best First Search", "aim": "To implement Greedy Best First Search by selecting the frontier node with the lowest heuristic value.", "filename": "program_03_best_first_search.py", "code": "import heapq\n\ngraph = {\"S\": [\"A\", \"B\"], \"A\": [\"C\", \"D\"],\n         \"B\": [\"E\", \"G\"], \"C\": [], \"D\": [], \"E\": [], \"G\": []}\nheuristic = {\"S\": 7, \"A\": 6, \"B\": 2, \"C\": 5, \"D\": 4, \"E\": 1, \"G\": 0}\n\nqueue = [(heuristic[\"S\"], \"S\", [\"S\"])]\nvisited = set()\n\nwhile queue:\n    _, node, path = heapq.heappop(queue)\n    if node == \"G\":\n        break\n    if node in visited:\n        continue\n    visited.add(node)\n    for neighbour in graph[node]:\n        if neighbour not in visited:\n            heapq.heappush(queue, (heuristic[neighbour], neighbour,\n                                   path + [neighbour]))\n\nprint(\"Best First Path:\", \" -> \".join(path))\n", "output": "Best First Path: S -> B -> G"}, {"title": "Heuristic Search", "aim": "To demonstrate heuristic search using Hill Climbing, choosing the neighbour that appears closest to the goal.", "filename": "program_04_heuristic_search.py", "code": "graph = {\"A\": [\"B\", \"C\"], \"B\": [\"D\"], \"C\": [\"E\"],\n         \"D\": [\"G\"], \"E\": [\"G\"], \"G\": []}\nheuristic = {\"A\": 4, \"B\": 3, \"C\": 2, \"D\": 1, \"E\": 1, \"G\": 0}\n\nnode = \"A\"\npath = [node]\nwhile node != \"G\":\n    choices = [v for v in graph[node] if heuristic[v] < heuristic[node]]\n    if not choices:\n        break\n    node = min(choices, key=heuristic.get)\n    path.append(node)\n\nprint(\"Heuristic Search Path:\", \" -> \".join(path))\n", "output": "Heuristic Search Path: A -> C -> E -> G"}, {"title": "A* and AO* Search Algorithms", "aim": "To implement A* and AO* search algorithms using heuristic information to find an optimal path or solution subgraph.", "sections": [{"label": "5(a). A* Search Algorithm", "filename": "program_05a_astar_search.py", "code": "import heapq\n\ngraph = {\"A\": {\"B\": 1, \"C\": 4}, \"B\": {\"C\": 2, \"D\": 5},\n         \"C\": {\"D\": 1, \"G\": 7}, \"D\": {\"G\": 3}, \"G\": {}}\nh = {\"A\": 7, \"B\": 6, \"C\": 4, \"D\": 3, \"G\": 0}\n\nqueue = [(h[\"A\"], 0, \"A\", [\"A\"])]\nbest = {\"A\": 0}\nwhile queue:\n    _, cost, node, path = heapq.heappop(queue)\n    if node == \"G\":\n        break\n    if cost != best[node]:\n        continue\n    for neighbour, weight in graph[node].items():\n        new_cost = cost + weight\n        if new_cost < best.get(neighbour, float(\"inf\")):\n            best[neighbour] = new_cost\n            heapq.heappush(queue, (new_cost + h[neighbour], new_cost,\n                                   neighbour, path + [neighbour]))\n\nprint(\"A* Path:\", \" -> \".join(path))\nprint(\"Total Cost:\", cost)\n", "output": "A* Path: A -> B -> C -> D -> G\nTotal Cost: 7"}, {"label": "5(b). AO* Search Algorithm", "filename": "program_05b_aostar_search.py", "code": "graph = {\n    \"A\": [[\"B\", \"C\"], [\"D\"]],\n    \"B\": [[\"E\"], [\"F\"]],\n    \"C\": [[\"G\"]],\n    \"D\": [[\"H\", \"I\"]]\n}\nchoice = {}\n\ndef ao_star(node):\n    if node not in graph:\n        return 0\n    options = []\n    for group in graph[node]:\n        cost = sum(1 + ao_star(child) for child in group)\n        options.append((cost, group))\n    best, choice[node] = min(options, key=lambda item: item[0])\n    return best\n\ndef show(node):\n    if node in choice:\n        children = choice[node]\n        print(node, \"->\", \" AND \".join(children))\n        for child in children:\n            show(child)\n\ntotal = ao_star(\"A\")\nprint(\"AO* Solution Graph:\")\nshow(\"A\")\nprint(\"Total Cost:\", total)\n", "output": "AO* Solution Graph:\nA -> D\nD -> H AND I\nTotal Cost: 3"}]}, {"title": "Water Jug Problem", "aim": "To solve the Water Jug Problem using state-space search to obtain the required quantity of water.", "filename": "program_06_water_jug.py", "code": "from collections import deque\n\nstart = (0, 0)\nqueue = deque([(start, [])])\nvisited = {start}\n\nwhile queue:\n    (a, b), path = queue.popleft()\n    if a == 2 or b == 2:\n        print(\"Water Jug Solution:\")\n        print(\"Start:\", start)\n        for action, state in path:\n            print(action + \":\", state)\n        break\n    x = min(a, 3 - b)\n    y = min(b, 4 - a)\n    moves = [\n        ((4, b), \"Fill 4L jug\"), ((a, 3), \"Fill 3L jug\"),\n        ((0, b), \"Empty 4L jug\"), ((a, 0), \"Empty 3L jug\"),\n        ((a - x, b + x), \"Pour 4L into 3L\"),\n        ((a + y, b - y), \"Pour 3L into 4L\")\n    ]\n    for state, action in moves:\n        if state not in visited:\n            visited.add(state)\n            queue.append((state, path + [(action, state)]))\n", "output": "Water Jug Solution:\nStart: (0, 0)\nFill 3L jug: (0, 3)\nPour 3L into 4L: (3, 0)\nFill 3L jug: (3, 3)\nPour 3L into 4L: (4, 2)"}, {"title": "Alpha-Beta Pruning Algorithm", "aim": "To implement Alpha-Beta Pruning to reduce the number of game-tree nodes evaluated by the Minimax algorithm.", "filename": "program_07_alpha_beta_pruning.py", "code": "values = [3, 5, 6, 9, 1, 2, 0, -1]\n\ndef alpha_beta(depth, index, maximizing, alpha, beta):\n    if depth == 3:\n        return values[index]\n    if maximizing:\n        best = float(\"-inf\")\n        for i in range(2):\n            best = max(best, alpha_beta(depth + 1, index * 2 + i,\n                                       False, alpha, beta))\n            alpha = max(alpha, best)\n            if alpha >= beta:\n                break\n        return best\n    best = float(\"inf\")\n    for i in range(2):\n        best = min(best, alpha_beta(depth + 1, index * 2 + i,\n                                   True, alpha, beta))\n        beta = min(beta, best)\n        if alpha >= beta:\n            break\n    return best\n\nprint(\"Optimal Value:\", alpha_beta(0, 0, True, float(\"-inf\"), float(\"inf\")))\n", "output": "Optimal Value: 5"}, {"title": "8 Queens Problem", "aim": "To place eight queens on an 8 × 8 chessboard so that no two queens attack each other.", "filename": "program_08_eight_queens.py", "code": "N = 8\nboard = [-1] * N\n\ndef safe(row, col):\n    for r in range(row):\n        if board[r] == col or abs(board[r] - col) == row - r:\n            return False\n    return True\n\ndef solve(row):\n    if row == N:\n        return True\n    for col in range(N):\n        if safe(row, col):\n            board[row] = col\n            if solve(row + 1):\n                return True\n    return False\n\nsolve(0)\nprint(\"8 Queens Solution:\")\nfor col in board:\n    print(\" \".join(\"*Q*\" if i == col else \"_\" for i in range(N)))\n", "output": "8 Queens Solution:\n*Q* _ _ _ _ _ _ _\n_ _ _ _ *Q* _ _ _\n_ _ _ _ _ _ _ *Q*\n_ _ _ _ _ *Q* _ _\n_ _ *Q* _ _ _ _ _\n_ _ _ _ _ _ *Q* _\n_ *Q* _ _ _ _ _ _\n_ _ _ *Q* _ _ _ _"}, {"title": "Default Reasoning Program", "aim": "To demonstrate default reasoning by assuming birds normally fly, except when an exception such as a penguin is known.", "filename": "program_09_default_reasoning.py", "code": "def reasoning(name, is_bird, is_penguin=False):\n    if is_penguin:\n        return name + \" cannot fly (exception).\"\n    if is_bird:\n        return name + \" can fly by default.\"\n    return \"No conclusion.\"\n\nprint(\"Default: Birds can fly.\")\nprint(reasoning(\"Tweety\", True))\nprint(\"Exception: Penguins cannot fly.\")\nprint(reasoning(\"Pingu\", True, True))\n", "output": "Default: Birds can fly.\nTweety can fly by default.\nException: Penguins cannot fly.\nPingu cannot fly (exception)."}, {"title": "Unification Algorithm", "aim": "To implement unification and find substitutions that make two logical expressions identical.", "filename": "program_10_unification.py", "code": "def resolve(term, substitutions):\n    while isinstance(term, str) and term in substitutions:\n        term = substitutions[term]\n    return term\n\ndef unify(x, y, substitutions):\n    x, y = resolve(x, substitutions), resolve(y, substitutions)\n    if x == y:\n        return True\n    if isinstance(x, str) and x.startswith(\"?\"):\n        substitutions[x] = y\n        return True\n    if isinstance(y, str) and y.startswith(\"?\"):\n        substitutions[y] = x\n        return True\n    if isinstance(x, tuple) and isinstance(y, tuple) and len(x) == len(y):\n        return all(unify(a, b, substitutions) for a, b in zip(x, y))\n    return False\n\nsubstitutions = {}\nfirst = (\"Likes\", \"?x\", \"?y\")\nsecond = (\"Likes\", \"John\", \"Mary\")\nif unify(first, second, substitutions):\n    print(\"Unifier:\", substitutions)\nelse:\n    print(\"Unification failed.\")\n", "output": "Unifier: {'?x': 'John', '?y': 'Mary'}"}, {"title": "Basic Rule-Based System", "aim": "To build a simple rule-based system that derives new facts by applying rules to known facts.", "filename": "program_11_rule_based_system.py", "code": "facts = {\"fever\", \"cough\"}\nrules = [\n    ({\"fever\", \"cough\"}, \"flu\"),\n    ({\"flu\"}, \"consult_doctor\")\n]\n\nfor conditions, result in rules:\n    if conditions.issubset(facts) and result not in facts:\n        facts.add(result)\n        print(\"Derived:\", result)\n\nprint(\"Final Facts:\", \", \".join(sorted(facts)))\n", "output": "Derived: flu\nDerived: consult_doctor\nFinal Facts: consult_doctor, cough, fever, flu"}, {"title": "8 Puzzle Using Different Heuristics", "aim": "To solve the 8 Puzzle using A* search with misplaced-tile and Manhattan-distance heuristics.", "filename": "program_12_eight_puzzle_heuristics.py", "code": "import heapq\n\nstart = (1, 2, 3, 4, 0, 6, 7, 5, 8)\ngoal = (1, 2, 3, 4, 5, 6, 7, 8, 0)\n\ndef misplaced(state):\n    return sum(tile != 0 and tile != goal[i] for i, tile in enumerate(state))\n\ndef manhattan(state):\n    total = 0\n    for i, tile in enumerate(state):\n        if tile:\n            j = goal.index(tile)\n            total += abs(i // 3 - j // 3) + abs(i % 3 - j % 3)\n    return total\n\ndef solve(heuristic):\n    queue = [(heuristic(start), 0, start)]\n    best = {start: 0}\n    while queue:\n        _, steps, state = heapq.heappop(queue)\n        if steps != best[state]:\n            continue\n        if state == goal:\n            return steps\n        zero = state.index(0)\n        for move in (-3, 3, -1, 1):\n            new = zero + move\n            if 0 <= new < 9 and not (move == -1 and zero % 3 == 0) \\\n                    and not (move == 1 and zero % 3 == 2):\n                board = list(state)\n                board[zero], board[new] = board[new], board[zero]\n                child = tuple(board)\n                if steps + 1 < best.get(child, 99):\n                    best[child] = steps + 1\n                    heapq.heappush(queue, (steps + 1 + heuristic(child),\n                                           steps + 1, child))\n    return -1\n\nprint(\"Moves using Misplaced Tiles:\", solve(misplaced))\nprint(\"Moves using Manhattan Distance:\", solve(manhattan))\n", "output": "Moves using Misplaced Tiles: 2\nMoves using Manhattan Distance: 2"}, {"title": "Tic-Tac-Toe Using Minimax Algorithm", "aim": "To play Tic-Tac-Toe against the computer using the Minimax algorithm to choose the best move.", "filename": "program_13_tic_tac_toe_minimax.py", "test_input": "1\n2\n4\n", "code": "board = [\" \"] * 9\nwins = [(0,1,2), (3,4,5), (6,7,8), (0,3,6),\n        (1,4,7), (2,5,8), (0,4,8), (2,4,6)]\n\ndef winner():\n    for a, b, c in wins:\n        if board[a] != \" \" and board[a] == board[b] == board[c]:\n            return board[a]\n    return None\n\ndef minimax(player):\n    result = winner()\n    if result == \"O\": return 1\n    if result == \"X\": return -1\n    if \" \" not in board: return 0\n    scores = []\n    for i in range(9):\n        if board[i] == \" \":\n            board[i] = player\n            scores.append(minimax(\"X\" if player == \"O\" else \"O\"))\n            board[i] = \" \"\n    return max(scores) if player == \"O\" else min(scores)\n\ndef best_move():\n    best, move = -2, -1\n    for i in range(9):\n        if board[i] == \" \":\n            board[i] = \"O\"\n            score = minimax(\"X\")\n            board[i] = \" \"\n            if score > best:\n                best, move = score, i\n    return move\n\nprint(\"You are X; AI is O.\")\nwhile not winner() and \" \" in board:\n    move = int(input(\"Your move (1-9): \")) - 1\n    if move not in range(9) or board[move] != \" \":\n        print(\"Invalid move. Try again.\")\n        continue\n    board[move] = \"X\"\n    if winner() or \" \" not in board:\n        break\n    move = best_move()\n    board[move] = \"O\"\n    print(\"AI chooses:\", move + 1)\n\nfor i in range(0, 9, 3):\n    print(\" | \".join(x if x != \" \" else \"_\" for x in board[i:i+3]))\n    if i < 6:\n        print(\"--+---+--\")\n\nprint(\"AI wins!\" if winner() == \"O\" else\n      \"You win!\" if winner() == \"X\" else \"Game drawn!\")\n", "output": "You are X; AI is O.\nYour move (1-9): 1\nAI chooses: 5\nYour move (1-9): 2\nAI chooses: 3\nYour move (1-9): 4\nAI chooses: 7\nX | X | O\n--+---+--\nX | O | _\n--+---+--\nO | _ | _\nAI wins!"}, {"title": "Sentence Palindrome Program", "aim": "To check whether a sentence is a palindrome by ignoring spaces, punctuation and letter case.", "filename": "program_14_sentence_palindrome.py", "test_input": "Madam, I'm Adam.\n", "code": "sentence = input(\"Enter a sentence: \")\nclean = \"\".join(ch.lower() for ch in sentence if ch.isalnum())\n\nif clean == clean[::-1]:\n    print(\"It is a palindrome.\")\nelse:\n    print(\"It is not a palindrome.\")\n", "output": "Enter a sentence: Madam, I'm Adam.\nIt is a palindrome."}];

  const token = /(#[^\n]*|\b(?:def|return|if|else|elif|for|while|in|not|and|or|is|import|from|as|class|True|False|None|break|continue|try|except|with|lambda|global)\b|\b(?:print|range|len|set|list|dict|tuple|sum|min|max|abs|enumerate|zip|sorted|input|int|str|float|super)\b|\b\d+(?:\.\d+)?\b|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')/g;
  let out='', last=0, m;
  while((m=token.exec(code))!==null){out+=esc(code.slice(last,m.index));const s=m[0];let cls='tok-num';if(s.startsWith('#'))cls='tok-comment';else if(s[0]==='"'||s[0]==="'")cls='tok-string';else if(/^(def|return|if|else|elif|for|while|in|not|and|or|is|import|from|as|class|True|False|None|break|continue|try|except|with|lambda|global)$/.test(s))cls='tok-keyword';else if(/^(print|range|len|set|list|dict|tuple|sum|min|max|abs|enumerate|zip|sorted|input|int|str|float|super)$/.test(s))cls='tok-builtin';out+='<span class="'+cls+'">'+esc(s)+'</span>';last=token.lastIndex;}
  out+=esc(code.slice(last));return out;
}
function buildNav(filter=''){
  list.innerHTML='';let count=0;
  PROGRAMS.forEach((p,i)=>{if(!p.title.toLowerCase().includes(filter.toLowerCase()))return;count++;const a=document.createElement('a');a.className='program-link';a.href='#e'+(i+1);a.dataset.index=i;a.setAttribute('aria-current',location.hash==='#e'+(i+1)?'true':'false');const b=document.createElement('b');b.textContent=String(i+1);const s=document.createElement('span');s.textContent=p.title;a.append(b,s);list.appendChild(a);});
  if(!count){const d=document.createElement('div');d.className='empty';d.textContent='No programs found.';list.appendChild(d);}
}
function downloadFile(name, content, type='text/plain'){
  const blob=new Blob([content],{type:type+';charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
async function copyText(text,button){
  try{await navigator.clipboard.writeText(text);button.textContent='Copied';}
  catch(e){const area=document.createElement('textarea');area.value=text;document.body.appendChild(area);area.select();document.execCommand('copy');area.remove();button.textContent='Copied';}
  setTimeout(()=>button.textContent='Copy',1200);
}
function renderHome(){
  homeNav.setAttribute('aria-current','true');
  main.innerHTML='<h2>AI Lab – Python Programs</h2><p class="subtitle">Artificial Intelligence Laboratory Practical Programs</p><p class="aim">This lab contains 14 Python practical programs. Select a program from the navigation panel to view its AIM, PROGRAM and OUTPUT. You can copy the source code, download an individual Python file or print a program.</p><h3>All Programs</h3><div class="home-grid" id="homeGrid"></div><div class="footer">AI LAB – PYTHON PROGRAMS · 14 practical programs</div>';
  const grid=document.getElementById('homeGrid');PROGRAMS.forEach((p,i)=>{const a=document.createElement('a');a.className='home-card';a.href='#e'+(i+1);const n=document.createElement('b');n.textContent=String(i+1).padStart(2,'0');const t=document.createElement('span');t.textContent=p.title;a.append(n,t);grid.appendChild(a);});
  document.title='AI LAB – PYTHON PROGRAMS | Artificial Intelligence Laboratory Practicals';
  buildNav(search.value);
}
function renderProgram(i){
  activeIndex=i;const p=PROGRAMS[i];homeNav.removeAttribute('aria-current');
  main.innerHTML='';
  const h=document.createElement('h2');h.textContent='Program '+(i+1)+': '+p.title;main.appendChild(h);
  const aim=document.createElement('p');aim.className='aim';aim.textContent='Aim: '+p.aim;main.appendChild(aim);
  const sections=p.sections || [{label:'Program',filename:p.filename,code:p.code,output:p.output}];
  sections.forEach((section, index)=>{
    const ph=document.createElement('h3');ph.className='section-label';
    ph.textContent=section.label || 'Program';main.appendChild(ph);
    const head=document.createElement('div');head.className='head';
    const fname=document.createElement('span');fname.textContent=section.filename;head.appendChild(fname);
    const buttons=document.createElement('div');buttons.className='btns';
    const dl=document.createElement('button');dl.className='download';dl.textContent='Download Python File';dl.type='button';dl.addEventListener('click',()=>downloadFile(section.filename,section.code));
    const cp=document.createElement('button');cp.className='copy';cp.textContent='Copy Code';cp.type='button';cp.addEventListener('click',()=>copyText(section.code,cp));
    buttons.append(dl,cp);head.appendChild(buttons);main.appendChild(head);
    const code=document.createElement('pre');code.innerHTML=highlight(section.code);code.setAttribute('aria-label','Python source code');main.appendChild(code);
    const oh=document.createElement('h3');oh.className='section-label';oh.textContent='Output';main.appendChild(oh);
    const output=document.createElement('pre');output.className='output';output.textContent=section.output;main.appendChild(output);
  });
  const pager=document.createElement('div');pager.className='pager';
  const prev=document.createElement('button');prev.textContent=i===0?'← Home':'← Previous Program';prev.addEventListener('click',()=>location.hash=i===0?'home':'e'+i);
  const print=document.createElement('button');print.textContent='Print Program';print.addEventListener('click',()=>window.print());
  const next=document.createElement('button');next.textContent=i===PROGRAMS.length-1?'Back to Home':'Next Program →';next.addEventListener('click',()=>location.hash=i===PROGRAMS.length-1?'home':'e'+(i+2));
  pager.append(prev,print,next);main.appendChild(pager);
  const footer=document.createElement('div');footer.className='footer';footer.textContent='AI LAB – PYTHON PROGRAMS · Program '+(i+1)+' of '+PROGRAMS.length;main.appendChild(footer);
  document.title=p.title+' | AI LAB – PYTHON PROGRAMS';
  buildNav(search.value);window.scrollTo(0,0);
}
function route(){const m=/^#e(\d+)$/.exec(location.hash);if(m){const i=Number(m[1])-1;if(i>=0&&i<PROGRAMS.length){renderProgram(i);return;}}renderHome();}
search.addEventListener('input',()=>buildNav(search.value));
list.addEventListener('click',e=>{if(e.target.closest('a')){const a=e.target.closest('a');const i=Number(a.dataset.index);if(Number.isInteger(i))renderProgram(i);}});
homeNav.addEventListener('click',()=>renderHome());
document.getElementById('downloadPage').addEventListener('click',()=>downloadFile('AI_Lab_Python_Programs_Offline.html',document.documentElement.outerHTML,'text/html'));
document.getElementById('printNav').addEventListener('click',()=>window.print());
document.getElementById('themeToggle').addEventListener('click',()=>{const light=document.documentElement.dataset.theme!=='light';document.documentElement.dataset.theme=light?'light':'dark';document.getElementById('themeToggle').textContent=light?'Dark theme':'Light theme';});
window.addEventListener('hashchange',route);
route();
if('serviceWorker' in navigator && location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
</script>

.tok-keyword{color:#c792ea}.tok-builtin{color:#82aaff}.tok-string{color:#c3e88d}.tok-comment{color:#78909c}.tok-num{color:#f78c6c}
